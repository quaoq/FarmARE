schema_version: farm_dcore_matrix_v1
analysis_block: primary_pass_1
scientific_contract: v5
paper_mode: false
primary_team_id: wetjune_2agent
scenarios: [farm_wetjune_recheck, farm_disease_drought, farm_three_cultivar]
native_scenario_by_id:
  farm_disease_drought:
    scenario_revision: drought_water_balance_v5
    calibration_candidate: true
repetitions: 2
planned_repetitions: 2
repeat_indices: [0]
world_seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
scheduler_seeds: [0]
model_seeds: [0]
fault_seeds: [0]
controller_mode: llm
max_model_calls: 700
team_call_budget: 700
team_token_budget: 24000000
max_output_tokens: 4096
pricing_assumptions: &pricing
  model_snapshot: gpt-5.4-mini-2026-03-17
  input_usd_per_million: 0.75
  output_usd_per_million: 4.50
  assumed_output_share: 0.20
  source: https://developers.openai.com/api/docs/models/gpt-5.4-mini
  retrieved_utc: "2026-09-13"
team_spec_by_id:
  wetjune_2agent: ../../../../AAMAS/authored_specifications/wetjune_2agent.team.json
petri_spec_by_scenario:
  farm_wetjune_recheck: ../../../../AAMAS/authored_specifications/farm_wetjune_recheck.process.json
  farm_disease_drought: ../../../../AAMAS/authored_specifications/farm_disease_drought.process.json
  farm_three_cultivar: ../../../../AAMAS/authored_specifications/farm_three_cultivar.process.json
controller_profiles:
  - id: primary_react
    model_by_actor: {field_intelligence: gpt-5.4-mini-2026-03-17, operations: gpt-5.4-mini-2026-03-17}
    provider_by_actor: {field_intelligence: openai-json, operations: openai-json}
    agent_family_by_actor: {field_intelligence: farm_baseline_react, operations: farm_baseline_react}
    history_window_by_actor: {field_intelligence: 8, operations: 8}
    temperature_by_actor: {field_intelligence: 0.0, operations: 0.0}
conditions:
  - id: scripted_petri_oracle
    execution: dcore
    controller_mode: scripted
    repeat_policy: once_per_world
    visibility: shared_blackboard
    handoff: causal
    enforcement: audit
    faults: [none]
  - id: farmare_direct
    execution: farmare_direct
    visibility: shared_blackboard
    handoff: causal
    enforcement: audit
    faults: [none]
  - id: farmare_a2a
    execution: farmare_a2a
    visibility: shared_blackboard
    handoff: causal
    enforcement: audit
    faults: [none]
  - id: shared_blackboard
    execution: dcore
    visibility: shared_blackboard
    handoff: causal
    enforcement: audit
    faults: [none]
  - &wet_free
    id: local_free_text
    execution: dcore
    scenarios: [farm_wetjune_recheck]
    visibility: local
    handoff: free_text
    enforcement: "off"
    faults: &faults [none, delay_within_validity, delay_past_validity, delay_past_deadline, drop, duplicate, reorder, mixed]
  - &wet_audit
    id: local_causal_audit
    execution: dcore
    scenarios: [farm_wetjune_recheck]
    visibility: local
    handoff: causal
    enforcement: audit
    faults: *faults
  - &wet_enforce
    id: local_causal_enforce
    execution: dcore
    scenarios: [farm_wetjune_recheck]
    visibility: local
    handoff: causal
    enforcement: enforce
    faults: *faults
  - {id: transfer_free_text, execution: dcore, scenarios: [farm_disease_drought, farm_three_cultivar], visibility: local, handoff: free_text, enforcement: "off", faults: [none, mixed]}
  - {id: transfer_causal_audit, execution: dcore, scenarios: [farm_disease_drought, farm_three_cultivar], visibility: local, handoff: causal, enforcement: audit, faults: [none, mixed]}
  - {id: transfer_causal_enforce, execution: dcore, scenarios: [farm_disease_drought, farm_three_cultivar], visibility: local, handoff: causal, enforcement: enforce, faults: [none, mixed]}

# Prospective handover cohort; paper execution remains gated.
max_prompt_tokens: 32768
endpoint_by_actor_by_team_id:
  wetjune_2agent: {field_intelligence: 'https://api.openai.com/v1', operations: 'https://api.openai.com/v1'}
  wetjune_3agent: {scouting: 'https://api.openai.com/v1', agronomy: 'https://api.openai.com/v1', operations: 'https://api.openai.com/v1'}
  wetjune_4agent: {scouting: 'https://api.openai.com/v1', agronomy: 'https://api.openai.com/v1', resource_management: 'https://api.openai.com/v1', operations: 'https://api.openai.com/v1'}
